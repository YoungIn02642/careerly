<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>본인확인 (개발용)</title>
<!--
  NICE 본인확인 팝업을 대신하는 **개발용** 화면.

  상용 키(NICE_SITE_CODE 등)가 아직 없어서, 인증 흐름·중복 차단·화면 연결을
  실제로 돌려 보기 위한 대역이다. 서버가 운영(NODE_ENV=production)에서는
  이 경로로 오는 요청을 503 으로 막으므로 이 화면만으로는 아무것도 통과하지 않는다.

  키가 나오면 이 파일을 지우고 NICE 표준 팝업으로 바꾸면 된다 —
  부모 창과 주고받는 규약(window.opener.postMessage)은 그대로 쓴다.
-->
<style>
  body {
    font-family: 'Malgun Gothic', -apple-system, sans-serif;
    margin: 0; padding: 28px 24px; background: #f6f6f4; color: #080808;
  }
  .card { max-width: 380px; margin: 0 auto; background: #fff; border-radius: 10px;
          padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #8a8a8a; margin: 0 0 18px; line-height: 1.5; }
  .warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
          font-size: 12px; padding: 9px 11px; border-radius: 6px; margin-bottom: 18px; line-height: 1.5; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 0 0 5px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 11px; font-size: 14px;
          border: 1px solid #e5e5e8; border-radius: 6px; font-family: inherit; margin-bottom: 14px; }
  input:focus { outline: none; border-color: #6d3aff; }
  button { width: 100%; padding: 12px; background: #080808; color: #fff; border: 0;
           border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { color: #ee1d36; font-size: 12.5px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>본인확인</h1>
  <p class="sub">휴대폰 번호로 본인을 확인합니다.</p>

  <div class="warn">
    <b>개발용 화면입니다.</b> 실제 통신사 인증이 아니며, 입력한 번호로 임시 식별값을
    만듭니다. 같은 번호로는 계정을 하나만 만들 수 있습니다.
  </div>

  <div class="err" id="err"></div>

  <label for="name">이름</label>
  <input type="text" id="name" placeholder="실명" autocomplete="name" />

  <label for="phone">휴대폰 번호</label>
  <input type="tel" id="phone" placeholder="010-1234-5678" autocomplete="tel" />

  <button id="ok">인증 완료</button>
</div>

<script>
(function () {
  var errBox = document.getElementById('err');
  var btn = document.getElementById('ok');

  function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }

  btn.addEventListener('click', async function () {
    errBox.style.display = 'none';
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();
    if (!name) return showErr('이름을 입력해 주세요.');
    if (!phone) return showErr('휴대폰 번호를 입력해 주세요.');

    btn.disabled = true;
    try {
      var res = await fetch('/api/verify/result', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: name, phone: phone }),
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || '인증에 실패했습니다.');

      /* 부모 창에 결과를 넘긴다. CI 자체는 서버가 들고 있고 여기로 내려오지 않는다 —
         화면이 받는 것은 단명 토큰뿐이다. */
      if (window.opener) {
        window.opener.postMessage({
          type: 'careerly:verified',
          token: data.token, name: data.name, phoneMasked: data.phoneMasked,
        }, window.location.origin);
        window.close();
      } else {
        showErr('부모 창을 찾지 못했습니다. 회원가입 화면에서 다시 시도해 주세요.');
      }
    } catch (e) {
      showErr(e.message);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('phone').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });
})();
</script>
</body>
</html>
