<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>커리얼리 - 로그인</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f7f6f1;
      --surface:     #ffffff;
      --border:      rgba(0,0,0,0.12);
      --text-p:      #1a1a18;
      --text-s:      #5f5e5a;
      --text-m:      #9c9a92;
      --brand-color: #534AB7;
      --font:        -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      padding: 40px;
      border-radius: 14px;
      border: 0.5px solid var(--border);
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .logo {
      color: var(--brand-color);
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 30px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      letter-spacing: -0.5px;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-s);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 0.5px solid var(--border);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input:focus { border-color: var(--brand-color); }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--text-p);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      font-size: 14px;
      font-family: var(--font);
      transition: background 0.2s;
    }

    .btn-submit:hover { background: #333; }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-m);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .footer-links a {
      color: var(--text-s);
      text-decoration: none;
    }

    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">
    <a href="Main_web.html" class="logo">CAREERLY</a>

    <div class="error-box" id="error-box"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label>아이디</label>
        <input
          type="text"
          id="username"
          placeholder="아이디를 입력하세요"
          autocomplete="username"
        />
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
        />
      </div>
      <button type="submit" class="btn-submit" id="login-btn">로그인</button>
    </form>

    <div class="footer-links">
      <a href="#">비밀번호 찾기</a>
      <span>|</span>
      <a href="signup.html">회원가입</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const loginBtn = document.getElementById('login-btn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideError();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('아이디와 비밀번호를 입력해주세요.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '처리 중...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || '아이디 또는 비밀번호가 올바르지 않습니다.');
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }

        // 로그인 성공 — 사용자 정보 저장 후 메인으로 이동
        localStorage.setItem('careerly_user', JSON.stringify(data.user));
        window.location.href = 'Main_web.html';

      } catch (err) {
        showError('서버 오류가 발생했습니다. 다시 시도해주세요.');
        passwordInput.value = '';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
      }
    });
  </script>

</body>
</html>
